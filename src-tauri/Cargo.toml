[package]
name = "project-jira"
version = "0.1.0"
description = "Capture tasks, track time, push to Jira"
authors = ["hpnightowl"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "project_jira_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
reqwest = { version = "0.13.5", features = ["json", "query", "stream"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service", "crypto-rust"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
futures-util = "0.3.34"
tokio = { version = "1.53.2", features = ["time"] }
ctrlc = { version = "3.5.2", features = ["termination"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.2", features = ["macros", "rt"] }
wiremock = "0.6.5"
